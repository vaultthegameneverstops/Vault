name: dbg
on: push
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: |
          mkdir k && cd k && npm init -y >/dev/null && npm i kokoro-js@latest >/dev/null 2>&1; npm ls kokoro-js
          cat > t.mjs <<'JS'
          import { KokoroTTS } from "kokoro-js";
          const t0=Date.now();
          const tts = await KokoroTTS.from_pretrained("onnx-community/Kokoro-82M-v1.0-ONNX", { dtype: "q8", device: "cpu" });
          console.log("LOAD ms", Date.now()-t0);
          console.log("VOICES", JSON.stringify(Object.keys(tts.voices||{})));
          const t1=Date.now();
          const a = await tts.generate("Mahomes drops back, fires deep down the left side, caught by Kelce! First down Chiefs!", { voice: "am_michael" });
          console.log("GEN ms", Date.now()-t1, "sr", a.sampling_rate, "len", a.audio.length, "proto", Object.getOwnPropertyNames(Object.getPrototypeOf(a)).join(","));
          JS
          node t.mjs 2>&1 | tail -8
          du -sh ~/.cache/huggingface 2>/dev/null; find / -name "model_quantized.onnx" -path "*Kokoro*" 2>/dev/null | xargs -r ls -la; find / -name "*.onnx" -size +10M 2>/dev/null | grep -i kokoro | xargs -r ls -la
          grep -o '"version": "[^"]*"' node_modules/kokoro-js/package.json
          grep -n "dtype\|q4\|q8\|fp16\|webgpu" node_modules/kokoro-js/README.md | head -20
      - run: |
          python3 - <<'PY'
          import json,urllib.request
          def g(u): return json.load(urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0"})))
          B="https://site.api.espn.com/apis/site/v2/sports/football/"
          for path in ["nfl","college-football"]:
            sb=g(B+path+"/scoreboard")
            ev=[e for e in sb["events"] if e["status"]["type"]["state"]!="pre"]
            if not ev: continue
            s=g(B+path+"/summary?event="+ev[0]["id"])
            dr=s["drives"]; pl=[p for d in dr.get("previous",[]) for p in d["plays"]]
            types={}
            for p in pl: types.setdefault(p["type"]["text"],p)
            for k,p in types.items(): print("T",path,"|",k,"|",p.get("text","")[:170],"|",(p.get("start") or {}).get("downDistanceText"),"|",p.get("statYardage"))
            d0=dr["previous"][-1]; print("DRIVE",json.dumps({k:d0.get(k) for k in ("description","displayResult","shortDisplayResult","yards","offensivePlays","isScore")}))
          PY
