name: dbg
on: push
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - shell: bash {0}
        run: |
          pip install -q playwright 2>&1 | tail -1
          curl -s -D - -o /dev/null -H "Origin: http://localhost:8000" -H "User-Agent: Mozilla/5.0 Chrome/130" "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard" | grep -i "HTTP\|access-control"
          python3 - <<'PY'
          import asyncio
          from playwright.async_api import async_playwright
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch(channel="chrome")
              pg=await b.new_page()
              await pg.goto("https://vaultthegameneverstops.github.io/Vault/")
              await asyncio.sleep(3)
              for opt in ["{}","{cache:'no-store'}","{mode:'cors'}"]:
                r=await pg.evaluate("(async()=>{try{const r=await fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard',"+opt+");const j=await r.json();return 'ok '+r.status+' events '+j.events.length}catch(e){return 'ERR '+e}})()")
                print("FETCH",opt,r)
              r=await pg.evaluate("(async()=>{try{const r=await fetch('https://site.api.espn.com/apis/site/v2/sports/basketball/mens-college-basketball/scoreboard?groups=50&limit=400');const t=await r.text();return 'ok '+t.length}catch(e){return 'ERR '+e}})()")
              print("CBB",r)
              await b.close()
          asyncio.run(main())
          PY
