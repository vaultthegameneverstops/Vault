name: dbg
on: push
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - shell: bash {0}
        run: |
          pip install -q playwright 2>&1 | tail -1
          mkdir -p /tmp/vault_live && cp scores.json plays.json /tmp/vault_live/
          python3 tools/espn_pass.py /tmp/vault_live && VAULT_LIVE_DIR=/tmp/vault_live python3 tools/live.py && cp /tmp/vault_live/scores.json /tmp/vault_live/plays.json .
          python3 -c "import json;p=json.load(open('plays.json'))['games'];print('RP',{k:len(v.get('rp') or []) for k,v in p.items()})"
          (python3 -m http.server 8000 >/dev/null 2>&1 &) ; sleep 1
          python3 - <<'PY'
          import asyncio
          from playwright.async_api import async_playwright
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch(channel="chrome",args=["--autoplay-policy=no-user-gesture-required"])
              pg=await b.new_page()
              pg.on("pageerror",lambda e: print("PAGEERR",e))
              pg.on("console",lambda m: print("C",m.text[:200]) if m.type in ("error","warning") else None)
              await pg.add_init_script("window.__played=0;window.__ended=0;window.__dur=0;window.__err=0;const op=HTMLMediaElement.prototype.play;HTMLMediaElement.prototype.play=function(){window.__played++;this.addEventListener('ended',()=>{window.__ended++;window.__dur+=this.duration||0});this.addEventListener('error',()=>{window.__err++});return op.call(this)}")
              await pg.goto("http://localhost:8000/#booth")
              await asyncio.sleep(5)
              tabs=await pg.eval_on_selector_all(".bth-chip","a=>a.map(x=>x.getAttribute('data-bp')+' '+x.querySelector('small').textContent)")
              print("TABS",tabs)
              fb=[t.split()[0] for t in tabs if t.startswith(("nfl","cfb"))]
              hp=[t.split()[0] for t in tabs if t.startswith(("cbb","nba"))]
              for gid in []:
                await pg.click(f'[data-bp="{gid}"]')
                seen=[]
                for i in range(16):
                  await asyncio.sleep(2.2)
                  t=await pg.evaluate("document.querySelector('#bpWho').innerText.replace(/\\n/g,' ')+': '+document.querySelector('#bpSay').innerText")
                  if not seen or seen[-1]!=t: seen.append(t)
                print("GAME",gid); [print("  ",x[:220]) for x in seen]
              await pg.click("#bpHD")
              st=""
              for i in range(40):
                await asyncio.sleep(5)
                st=await pg.inner_text("#bpHD")
                if "on" in st or "unavailable" in st: break
              print("HD",st,"|",await pg.inner_text("#bpHDn"))
              await asyncio.sleep(60)
              print("PLAYED",await pg.evaluate("[window.__played,window.__ended,Math.round(window.__dur),window.__err]"))
              await b.close()
          asyncio.run(main())
          PY
