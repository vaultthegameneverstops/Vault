name: dbg
on: push
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          pip install -q playwright 2>&1 | tail -2
          mkdir -p site && cat > site/t.html <<'HTML'
          <!doctype html><html><body><pre id=o>start</pre><script type="module">
          const o=document.getElementById('o');const log=(...a)=>{o.textContent+="\n"+a.join(" ");console.log(a.join(" "))};
          try{
            const t0=performance.now();
            const m=await import("https://cdn.jsdelivr.net/npm/kokoro-js@1.2.1/+esm");
            log("IMPORT ok keys", Object.keys(m).join(","), Math.round(performance.now()-t0));
            const t1=performance.now();
            const tts=await m.KokoroTTS.from_pretrained("onnx-community/Kokoro-82M-v1.0-ONNX",{dtype:"q8",device:"wasm"});
            log("LOAD ms",Math.round(performance.now()-t1));
            log("VOICES",JSON.stringify(Object.keys(tts.voices||{})));
            for (const v of ["am_michael","af_heart","am_onyx","bm_george"]) {
              const t2=performance.now();
              const a=await tts.generate("Mahomes drops back, fires deep down the left side, caught by Kelce! First down Chiefs!",{voice:v});
              log("GEN",v,Math.round(performance.now()-t2),"ms sr",a.sampling_rate,"secs",(a.audio.length/a.sampling_rate).toFixed(2),"blob",typeof a.toBlob);
            }
            log("DONE");
          }catch(e){log("ERR",e&&e.stack||e)}
          </script></body></html>
          HTML
          cd site && (python3 -m http.server 8000 >/dev/null 2>&1 &) && sleep 1 && cd ..
          python3 - <<'PY'
          import asyncio
          from playwright.async_api import async_playwright
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch(channel="chrome")
              pg=await b.new_page()
              pg.on("console",lambda m: print("C",m.text[:300]))
              await pg.goto("http://localhost:8000/t.html")
              for i in range(60):
                await asyncio.sleep(5)
                t=await pg.inner_text("#o")
                if "DONE" in t or "ERR" in t: break
              print(t)
              rs=await pg.evaluate("performance.getEntriesByType('resource').filter(r=>r.transferSize>500000).map(r=>r.name.split('/').slice(-3).join('/')+' '+Math.round(r.transferSize/1e6)+'MB')")
              print("BIG",rs)
              await b.close()
          asyncio.run(main())
          PY
