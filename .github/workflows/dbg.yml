name: dbg
on: push
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard" "https://site.api.espn.com/apis/site/v2/sports/basketball/mens-college-basketball/summary?event=401920530" "https://a.espncdn.com/combiner/i?img=/i/teamlogos/nfl/500/kc.png&w=80&h=80"; do
            echo "== $u"; curl -s -D - -o /dev/null -H "Origin: https://vaultthegameneverstops.github.io" "$u" | grep -i -E "^HTTP|access-control|cache-control|age:|content-type" ; done
