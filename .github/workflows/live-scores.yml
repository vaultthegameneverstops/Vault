name: Live scores

# Every 5 minutes: pull live scores from ESPN's public scoreboard, merge them into
# scores.json / plays.json with tools/live.py, commit if anything changed, and deploy the site.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths-ignore:
      - "scores.json"
      - "plays.json"

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: vault-live
  cancel-in-progress: false

jobs:
  update:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      changed: ${{ steps.merge.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch live pass from ESPN
        run: |
          mkdir -p /tmp/vault_live
          cp scores.json plays.json /tmp/vault_live/ 2>/dev/null || true
          python3 tools/espn_pass.py /tmp/vault_live

      - name: Merge into scores.json / plays.json
        id: merge
        env:
          VAULT_LIVE_DIR: /tmp/vault_live
          VAULT_SRC: ESPN scoreboard via VAULT live feed
        run: |
          out=$(python3 tools/live.py)
          echo "$out"
          if [[ "$out" == CHANGED* ]]; then
            cp /tmp/vault_live/scores.json /tmp/vault_live/plays.json .
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit
        if: steps.merge.outputs.changed == 'true'
        run: |
          git config user.name "vault-live[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scores.json plays.json
          git commit -m "Live scores $(date -u +%H:%MZ)" || exit 0
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "$GITHUB_REF_NAME" && git push && exit 0
            sleep 5
          done
          exit 1

      - name: Package site
        if: steps.merge.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # GitHub's cron often runs late or skips. Each scheduled/manual run waits ~4 minutes,
  # then queues the next one, so scores keep flowing about every 5 minutes.
  next:
    needs: [update, deploy]
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait, then queue the next update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 230
          gh workflow run live-scores.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
